<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Map English - IELTS 7.0</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }
        #left-panel { width: 35%; padding: 20px; background-color: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 10;}
        #right-panel { width: 65%; display: flex; flex-direction: column; position: relative; }
        .chat-box { flex-grow: 1; overflow-y: auto; background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;}
        .msg { padding: 10px 15px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 1.2em; }
        .msg.ai { background: #3b82f6; align-self: flex-start; }
        .msg.user { background: #10b981; align-self: flex-end; }
        .msg.system { background: #64748b; align-self: center; font-size: 0.85em; text-align: center; }
        .controls { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { padding: 10px 20px; background: #3b82f6; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button:hover { background: #2563eb; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        #map-container { flex-grow: 1; width: 100%; }
        
        /* Cụm công cụ bản đồ */
        .map-tools { position: absolute; top: 10px; right: 10px; background: rgba(30, 41, 59, 0.9); padding: 10px; border-radius: 8px; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .map-tools select, .map-tools button { padding: 5px; margin-bottom: 5px; width: 100%; background: #334155; color: white; border: 1px solid #475569; border-radius: 4px;}
        
        /* Thanh thống kê */
        .stats-bar { background: #1e293b; padding: 10px 20px; font-size: 0.9em; display: flex; justify-content: space-between; border-bottom: 1px solid #334155;}
        #current-target { color: #f59e0b; font-weight: bold; font-size: 1.2em; margin-bottom: 10px;}
        .recording-indicator { color: #ef4444; font-weight: bold; display: none; animation: blink 1s infinite;}
        
        /* Bảng điều khiển Đại tinh (L1) */
        #l1-panel { position: absolute; top: 50px; left: 10px; background: rgba(30, 41, 59, 0.9); padding: 10px; border-radius: 8px; z-index: 100; max-height: 80%; overflow-y: auto; display: none;}
        .l1-item { padding: 8px; margin-bottom: 5px; background: #334155; border-radius: 5px; cursor: pointer; font-size: 0.85em; transition: 0.2s;}
        .l1-item:hover { background: #475569; border-left: 3px solid #3b82f6; }
        .l1-title { font-weight: bold; color: #38bdf8; }
        
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="left-panel">
    <h2>Combat Session</h2>
    <div id="current-target">Target: <span id="target-word">None</span></div>
    <div class="chat-box" id="chat-box"></div>
    
    <div class="controls">
        <label><input type="checkbox" id="use-mic"> Dùng Mic (Tự động gửi)</label>
        <span class="recording-indicator" id="recording-dot">🎤 Đang nghe...</span>
    </div>
    <div class="controls" style="margin-top: 10px;">
        <input type="text" id="user-input" placeholder="Gõ câu trả lời hoặc nói vào mic...">
        <button id="send-btn">Gửi</button>
    </div>
    <button id="next-btn" style="margin-top: 15px; width: 100%; background: #f59e0b; padding: 15px;">🚀 Bắt đầu / Học cụm tiếp theo</button>
</div>

<div id="right-panel">
    <div class="stats-bar">
        <span>Total Mastery: <strong id="total-mastery" style="color: #10b981;">0</strong></span>
        <span id="nav-breadcrumb" style="font-weight: bold; color: #e2e8f0;">Bậc: Ngân Hà (Root)</span>
    </div>
    <div class="map-tools">
        <label style="font-size: 0.85em;">Tô màu theo:</label>
        <select id="color-metric" onchange="renderMap()">
            <option value="mastery">Mastery (Độ thông thạo)</option>
            <option value="forgetting">Forgetting (Sắp quên)</option>
            <option value="l1">Đại tinh (L1 Cluster)</option>
        </select>
        <button onclick="zoomOut()">🔙 Trở lại bậc trên</button>
    </div>
    
    <div id="l1-panel"></div>
    <div id="map-container"></div>
</div>

<script>
    let chatHistory = [];
    let currentNode = null;
    let audioObj = null;
    let recognition = null;
    let currentMapLevel = { level: 'root', l1: -1, l2: -1, l3: -1 };
    let mapDataCache = [];
    
    // Timer chống câm lặng
    let silenceTimeout = null;
    const SILENCE_LIMIT_MS = 3000; // Rút xuống 3 giây, ngắc ngứ là chửi luôn cho real
    let isSessionActive = false;

    // Format ngày hiển thị hover
    function formatDate(timestamp) {
        if (!timestamp || timestamp === 0) return "Chưa học";
        return new Date(timestamp * 1000).toLocaleDateString('vi-VN');
    }

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US'; 

        recognition.onstart = function() {
            document.getElementById('recording-dot').style.display = 'inline';
        };

        recognition.onresult = function(event) {
            resetSilenceTimer(); // Có tín hiệu nói là hủy timer chửi
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }
            if(finalTranscript !== '') {
                document.getElementById('user-input').value = finalTranscript;
                // Auto send khi kết thúc câu nói 1.5s
                setTimeout(() => {
                    if(!document.getElementById('send-btn').disabled) {
                        document.getElementById('send-btn').click();
                    }
                }, 1500);
            }
        };

        recognition.onend = function() {
            document.getElementById('recording-dot').style.display = 'none';
            if (document.getElementById('use-mic').checked && !audioObj && isSessionActive) {
                try { recognition.start(); } catch(e){}
            }
        };
    }

    // Logic Timer câm lặng
    function startSilenceTimer() {
        if (!isSessionActive) return;
        clearTimeout(silenceTimeout);
        silenceTimeout = setTimeout(() => {
            if (isSessionActive) {
                sendMessage("[SYSTEM_SILENCE]");
            }
        }, SILENCE_LIMIT_MS);
    }

    function resetSilenceTimer() {
        clearTimeout(silenceTimeout);
    }
    
    // Ghi nhận sự kiện gõ phím để chặn AI chửi
    document.getElementById('user-input').addEventListener('input', resetSilenceTimer);

    function addMessage(role, text) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        
        // Regex loại bỏ thẻ <en> và tô màu vàng/in đậm tiếng Anh cho đẹp mắt
        let formattedText = text === "[SYSTEM_SILENCE]" ? "(Bạn im lặng quá lâu...)" : text;
        formattedText = formattedText.replace(/<en>(.*?)<\/en>/g, '<strong style="color: #fcd34d;">$1</strong>');
        
        div.innerHTML = formattedText;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function playTTS(text) {
        return new Promise((resolve) => {
            if (audioObj) audioObj.pause();
            if (recognition) recognition.stop();
            resetSilenceTimer();
            
            const url = `/api/tts?text=${encodeURIComponent(text)}`;
            audioObj = new Audio(url);
            audioObj.onended = () => {
                audioObj = null;
                if (document.getElementById('use-mic').checked && recognition && isSessionActive) {
                    try { recognition.start(); } catch(e){}
                }
                startSilenceTimer(); 
                resolve();
            };
            audioObj.play().catch(e => {
                console.error("Audio error", e);
                startSilenceTimer();
                resolve();
            });
        });
    }

    async function sendMessage(text) {
        if (!currentNode || !isSessionActive) return;
        
        resetSilenceTimer();
        addMessage('user', text);
        
        if (text !== "[SYSTEM_SILENCE]") {
            document.getElementById('user-input').value = '';
        }
        document.getElementById('send-btn').disabled = true;

        chatHistory.push({"role": "user", "content": text});

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ history: chatHistory })
            });
            const data = await res.json();
            
            chatHistory.push({"role": "assistant", "content": data.response});
            addMessage('ai', data.response);
            await playTTS(data.response);

            // Phase 2 hoàn thành hoặc Phase 0 (giải thích từ mới) kết thúc
            if (data.score >= 0 || data.score === -2) {
                isSessionActive = false;
                resetSilenceTimer();
                if (recognition) recognition.stop();
                
                await fetch('/api/update_node', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: currentNode.id, score: data.score})
                });
                
                if (data.score === -2) {
                    addMessage('system', `[SESSION END] Đã tiếp thu từ mới. Mastery khởi tạo: 0.5`);
                } else {
                    addMessage('system', `[SESSION END] Điểm đánh giá: ${data.score}/10`);
                }
                
                document.getElementById('next-btn').style.display = 'block';
                loadMapData(); 
            }
        } catch (error) {
            addMessage('system', '[LỖI MẠNG/API] Vui lòng gửi lại.');
            startSilenceTimer();
        }
        document.getElementById('send-btn').disabled = false;
    }

    document.getElementById('send-btn').onclick = () => {
        const text = document.getElementById('user-input').value.trim();
        if (text) sendMessage(text);
    };

    document.getElementById('user-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('send-btn').click();
    });

    document.getElementById('next-btn').onclick = async () => {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('chat-box').innerHTML = '';
        chatHistory = [];
        isSessionActive = true;
        
        const res = await fetch('/api/next_phrase');
        const data = await res.json();
        if (data.error) {
            alert(data.error);
            isSessionActive = false;
            document.getElementById('next-btn').style.display = 'block';
            return;
        }

        currentNode = data.node;
        document.getElementById('target-word').textContent = currentNode.chunk;
        
        const isNewWord = data.stats.last_studied === 0;

        if (isNewWord) {
            chatHistory.push({
                "role": "user",
                "content": `Từ khóa tao cần học là: "${currentNode.chunk}". Đây là lần đầu tiên tao gặp cụm này, hãy dạy tao.`
            });
        } else {
            chatHistory.push({
                "role": "user",
                "content": `Từ khóa tao cần học là: "${currentNode.chunk}". Bắt đầu Phase 1 đi, cho tao 1 câu ngẫu nhiên chứa nó và hỏi nghĩa!`
            });
        }

        const chatRes = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                history: chatHistory, 
                phase: isNewWord ? 0 : 1 
            })
        });
        const chatData = await chatRes.json();
        chatHistory.push({"role": "assistant", "content": chatData.response});
        addMessage('ai', chatData.response);
        
        // Cắt cầu Session nếu là Phase 0 (dạy từ mới)
        if (isNewWord || chatData.score === -2) {
            isSessionActive = false; // Tắt cờ session để chặn mic và chặn timer câm lặng
            resetSilenceTimer();
            if (recognition) recognition.stop();
            
            await fetch('/api/update_node', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: currentNode.id, score: -2})
            });
            
            addMessage('system', `[SESSION END] Đã tiếp thu từ mới. Mastery khởi tạo: 0.5`);
            document.getElementById('next-btn').style.display = 'block';
            loadMapData(); 
            
            // Cho máy đọc sau khi đã set cờ false, đảm bảo đọc xong không đếm ngược
            await playTTS(chatData.response);
        } else {
            await playTTS(chatData.response);
        }
    };

    // ==========================================
    // MODULE BẢN ĐỒ SAO
    // ==========================================
    
    async function loadMapData() {
        const {level, l1, l2, l3} = currentMapLevel;
        const res = await fetch(`/api/map_data?level=${level}&l1=${l1}&l2=${l2}&l3=${l3}`);
        const data = await res.json();
        mapDataCache = data.points;
        
        // Ẩn nút "Trở lại" nếu đang ở Root
        const backBtn = document.querySelector('.map-tools button');
        if (level === 'root') backBtn.style.display = 'none';
        else backBtn.style.display = 'block';
        
        document.getElementById('total-mastery').textContent = data.total_mastery.toFixed(1);
        
        // Động hóa tên Cluster trên Select Box
        const colorSelect = document.getElementById('color-metric');
        const clusterOpt = colorSelect.options[2];
        
        if (level === 'root') {
            clusterOpt.value = 'l1'; clusterOpt.text = 'Đại tinh (L1)';
            buildPanel('l1', 'Đại tinh', (id) => {
                currentMapLevel = {level: 'l1', l1: parseInt(id), l2: -1};
                document.getElementById('nav-breadcrumb').textContent = `Bậc: Đại tinh L1 (${id})`;
                loadMapData();
            });
        } else if (level === 'l1') {
            clusterOpt.value = 'l2'; clusterOpt.text = 'Tiểu tinh (L2)';
            buildPanel('l2', 'Tiểu tinh', (id) => {
                currentMapLevel = {level: 'l2', l1: l1, l2: parseInt(id)};
                document.getElementById('nav-breadcrumb').textContent = `Bậc: Tiểu tinh L2 (${id})`;
                loadMapData();
            });
        } else if (level === 'l2') {
            clusterOpt.value = 'l3'; clusterOpt.text = 'Chòm sao (L3)';
            buildPanel('l3', 'Chòm sao', (id) => {
                currentMapLevel = {level: 'l3', l1: l1, l2: l2, l3: parseInt(id)};
                document.getElementById('nav-breadcrumb').textContent = `Bậc: Chòm sao L3 (${id})`;
                loadMapData();
            });
        } else if (level === 'l3') {
            document.getElementById('l1-panel').style.display = 'none';
        }
        
        renderMap();
    }
    
    async function buildPanel(clusterKey, titleName, onClickCB) {
        const panel = document.getElementById('l1-panel');
        panel.style.display = 'block';
        panel.innerHTML = `<div style="font-weight:bold; margin-bottom:10px; color:#f59e0b;">Danh sách ${titleName}</div>`;
        
        const res = await fetch(`/api/stats?level=${clusterKey}`);
        const stats = await res.json();
        
        Object.keys(stats).sort((a,b) => stats[b].mastery - stats[a].mastery).forEach(c_id => {
            const stat = stats[c_id];
            const div = document.createElement('div');
            div.className = 'l1-item';
            div.innerHTML = `
                <div class="l1-title">${titleName} #${c_id}</div>
                <div>Mastery: ${stat.mastery.toFixed(1)}</div>
                <div>Top cụm: <i>${stat.topWord || 'None'}</i></div>
            `;
            if(onClickCB) {
                div.onclick = () => onClickCB(c_id);
            } else {
                div.style.cursor = 'default';
            }
            panel.appendChild(div);
        });
    }

    function renderMap() {
        const metric = document.getElementById('color-metric').value;
        const x = mapDataCache.map(p => p.x);
        const y = mapDataCache.map(p => p.y);
        
        // Chuẩn bị Text hover hiển thị đầy đủ thông tin yêu cầu
        const text = mapDataCache.map(p => {
            const blockStatus = p.block > 0 ? `<br><b style="color:red;">Blocked (Mở ở mốc: ${p.block})</b>` : '';
            return `<b>${p.chunk}</b><br>
            Mastery: ${p.mastery.toFixed(1)}<br>
            Forgetting Index: ${p.forgetting < 0 ? 'Chưa học' : p.forgetting.toFixed(2)}<br>
            Số lần học lại: ${p.study_count}<br>
            Lần học cuối: ${p.days_passed < 0 ? 'N/A' : (Math.floor(p.days_passed) + ' ngày trước')}${blockStatus}`;
        });
        
        let marker = { size: currentMapLevel.level === 'root' ? 3 : 5, opacity: 0.8 };

        if (metric === 'mastery') {
            marker.color = mapDataCache.map(p => p.norm_mastery);
            marker.colorscale = 'YlGnBu';
        } else if (metric === 'forgetting') {
            const maxF = Math.max(...mapDataCache.filter(p => p.forgetting >= 0).map(p => p.forgetting), 1);
            marker.color = mapDataCache.map(p => p.forgetting < 0 ? 0 : p.forgetting / maxF);
            marker.colorscale = 'Hot';
        } else if (metric === 'l1' || metric === 'l2' || metric === 'l3') {
            marker.color = mapDataCache.map(p => p[metric]);
            marker.colorscale = 'Rainbow';
        }

        const trace = {
            x: x, y: y, text: text,
            mode: 'markers', hoverinfo: 'text',
            type: 'scattergl',
            marker: marker
        };

        const layout = {
            paper_bgcolor: '#0f172a', plot_bgcolor: '#0f172a', margin: {t: 0, l: 0, r: 0, b: 0},
            xaxis: {showgrid: false, zeroline: false, visible: false},
            yaxis: {showgrid: false, zeroline: false, visible: false},
            hovermode: 'closest',
            dragmode: 'pan'
        };

        Plotly.newPlot('map-container', [trace], layout, {responsive: true, scrollZoom: true});

        document.getElementById('map-container').on('plotly_click', function(data) {
            const pointIdx = data.points[0].pointIndex;
            const node = mapDataCache[pointIdx];
            
            if (currentMapLevel.level === 'root') {
                currentMapLevel = {level: 'l1', l1: node.l1, l2: -1, l3: -1};
                document.getElementById('nav-breadcrumb').textContent = `Bậc: Đại tinh L1 (${node.l1})`;
                loadMapData();
            } else if (currentMapLevel.level === 'l1') {
                currentMapLevel = {level: 'l2', l1: node.l1, l2: node.l2, l3: -1};
                document.getElementById('nav-breadcrumb').textContent = `Bậc: Tiểu tinh L2 (${node.l2})`;
                loadMapData();
            } else if (currentMapLevel.level === 'l2') {
                currentMapLevel = {level: 'l3', l1: node.l1, l2: node.l2, l3: node.l3};
                document.getElementById('nav-breadcrumb').textContent = `Bậc: Chòm sao L3 (${node.l3})`;
                loadMapData();
            }
        });
    }

    function zoomOut() {
        if (currentMapLevel.level === 'l3') {
            currentMapLevel.level = 'l2';
            currentMapLevel.l3 = -1;
            document.getElementById('nav-breadcrumb').textContent = `Bậc: Tiểu tinh L2 (${currentMapLevel.l2})`;
        } else if (currentMapLevel.level === 'l2') {
            currentMapLevel.level = 'l1';
            currentMapLevel.l2 = -1;
            document.getElementById('nav-breadcrumb').textContent = `Bậc: Đại tinh L1 (${currentMapLevel.l1})`;
        } else if (currentMapLevel.level === 'l1') {
            currentMapLevel = {level: 'root', l1: -1, l2: -1, l3: -1};
            document.getElementById('nav-breadcrumb').textContent = `Bậc: Ngân Hà (Root)`;
        }
        loadMapData();
    }

    loadMapData();
</script>
</body>
</html>
